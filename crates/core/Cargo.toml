[package]
name = "assistant-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The chat-completions wire is opt-in: the tests run over scripted providers,
# and the binary crate is what turns the real wire on. The feature is named for
# the interface spoken — an OpenAI-compatible chat-completions endpoint — while
# the framework feature it enables keeps that project's own `openrouter` name.
# Enabling it here only re-exposes the framework's module wrapped around an
# in-memory configuration.
[features]
chat_completions = ["agent-ledger/openrouter"]

# The framework is a sibling checkout, not a registry crate: the path names the
# expected layout, and the repository it is published in is named in the README.
[dependencies]
agent-ledger = { path = "../../../agent-ledger/crates/agent-ledger" }
chrono = "0.4"
# The lookup tools' HTTP client — the framework's own major version, so the
# workspace keeps one HTTP stack and one TLS story. Recorded in
# docs/dependency-review.md before this manifest named it.
reqwest = { version = "0.13", features = ["json"] }
# The framework's consumer seam hands closures a `rusqlite::Connection` without
# re-exporting the crate; the direct dependency stays on the framework's major
# version so the two name one type.
rusqlite = "0.40"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

# Test-only. The chat-completions suite's scripted completions server is a plain
# listener on the loopback interface written against tokio's own networking,
# so it needs `net` and `io-util` and no new crate; `test-util` is what the
# window-expiry pins pause and advance the clock with. Cargo unifies
# features across a dependency graph, so these stay out of the library
# section.
[dev-dependencies]
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
