[package]
name = "assistant-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The OpenRouter wire is opt-in: the tests run over scripted providers, and the
# binary crate is what turns the real wire on. The feature name mirrors the
# framework's, and enabling it here only re-exposes the framework's module
# wrapped around an in-memory configuration.
[features]
openrouter = ["agent-ledger/openrouter"]

# The framework is a sibling checkout, not a registry crate: it has no public
# home yet, so the path names the expected layout (see the README).
[dependencies]
agent-ledger = { path = "../../../agent-ledger/crates/agent-ledger" }
chrono = "0.4"
# The framework's consumer seam hands closures a `rusqlite::Connection` without
# re-exporting the crate; the direct dependency stays on the framework's major
# version so the two name one type.
rusqlite = "0.40"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

# Test-only. The OpenRouter suite's scripted completions server is a plain
# listener on the loopback interface written against tokio's own networking,
# so it needs `net` and `io-util` and no new crate. Cargo unifies features
# across a dependency graph, so these stay out of the library section.
[dev-dependencies]
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
