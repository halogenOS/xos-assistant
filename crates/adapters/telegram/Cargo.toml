# The adapter speaks the Bot API directly over the HTTP client the framework
# already uses (decision 0013); only the `json` feature is named, and the
# client's own default supplies TLS with a vendored provider. Every crate here
# is recorded in docs/dependency-review.md before this manifest named it.
[package]
name = "assistant-adapter-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
assistant-core = { path = "../../core" }
chrono = "0.4"
# The webhook intake's listener: the server half of the stack the client
# already runs on, recorded in docs/dependency-review.md before this manifest
# named it. `hyper` serves the connection, `hyper-util` adapts tokio's socket
# to hyper's IO traits without the `unsafe` this workspace forbids and
# supplies the timer the head-read bound is measured on, and
# `http-body-util` bounds the body read and answers with an empty one.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `net` and `rt` are the listener's own: it binds a loopback socket and serves
# each connection as a task.
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

# Test-only. The scripted Bot API server in the test suite is a plain listener
# on the loopback interface written against tokio's own networking, so the
# suite needs `net` and `io-util` but no new crate; `test-util` is what the
# refresher's self-bound pin pauses the clock with. Cargo unifies features
# across a dependency graph, so these stay out of the library section.
[dev-dependencies]
agent-ledger = { path = "../../../../agent-ledger/crates/agent-ledger" }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
