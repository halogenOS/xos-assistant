[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/adapters/telegram",
    "crates/assistant",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
